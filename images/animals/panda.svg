<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="t-panda">
  <title id="t-panda">Pip the Panda — runzeculture mascot</title>
  <ellipse cx="120" cy="218" rx="74" ry="9" fill="#0B0B0F" opacity="0.06"/>
  <!-- Body -->
  <ellipse cx="120" cy="172" rx="60" ry="48" fill="#F4F4F1"/>
  <!-- Bamboo stem the panda holds -->
  <g stroke="#2EC4B6" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M168 144 Q186 132 198 152"/>
    <path d="M188 156 L196 156 M178 144 L186 144"/>
  </g>
  <g fill="#2EC4B6">
    <ellipse cx="200" cy="134" rx="8" ry="5" transform="rotate(-25 200 134)"/>
    <ellipse cx="194" cy="166" rx="8" ry="5" transform="rotate(35 194 166)"/>
  </g>
  <!-- Arms (dark) -->
  <ellipse cx="76" cy="172" rx="14" ry="22" fill="#0B0B0F"/>
  <ellipse cx="164" cy="172" rx="14" ry="22" fill="#0B0B0F"/>
  <!-- Legs (dark) -->
  <ellipse cx="98" cy="206" rx="16" ry="14" fill="#0B0B0F"/>
  <ellipse cx="142" cy="206" rx="16" ry="14" fill="#0B0B0F"/>
  <!-- Head -->
  <circle cx="120" cy="102" r="58" fill="#F4F4F1"/>
  <!-- Ears -->
  <circle cx="74" cy="56" r="20" fill="#0B0B0F"/>
  <circle cx="166" cy="56" r="20" fill="#0B0B0F"/>
  <!-- Eye patches -->
  <ellipse cx="98" cy="100" rx="16" ry="20" transform="rotate(-15 98 100)" fill="#0B0B0F"/>
  <ellipse cx="142" cy="100" rx="16" ry="20" transform="rotate(15 142 100)" fill="#0B0B0F"/>
  <!-- Eyes -->
  <g fill="#F4F4F1">
    <circle cx="100" cy="100" r="4"/>
    <circle cx="140" cy="100" r="4"/>
  </g>
  <!-- Nose -->
  <ellipse cx="120" cy="118" rx="6" ry="4" fill="#0B0B0F"/>
  <!-- Mouth -->
  <path d="M110 124 Q120 134 130 124" fill="none" stroke="#0B0B0F" stroke-width="2.4" stroke-linecap="round"/>
</svg>
